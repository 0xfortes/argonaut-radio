<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel Argonaut head, side profile: helmet, visor, face, torso. -->
  <rect width="16" height="16" rx="2" fill="#020402"/>
  <!-- helmet -->
  <rect x="5" y="1" width="6" height="1" fill="#72ff72"/>
  <rect x="4" y="2" width="8" height="1" fill="#72ff72"/>
  <rect x="3" y="3" width="10" height="1" fill="#72ff72"/>
  <rect x="3" y="4" width="11" height="1" fill="#72ff72"/>
  <!-- face -->
  <rect x="3" y="5" width="2" height="2" fill="#89959a"/>
  <rect x="3" y="7" width="10" height="1" fill="#89959a"/>
  <rect x="3" y="8" width="9" height="1" fill="#89959a"/>
  <rect x="4" y="9" width="8" height="1" fill="#89959a"/>
  <rect x="5" y="10" width="6" height="1" fill="#89959a"/>
  <!-- visor -->
  <rect x="5" y="5" width="10" height="2" fill="#ff4fd8"/>
  <!-- neck + torso -->
  <rect x="7" y="11" width="2" height="1" fill="#285b28"/>
  <rect x="5" y="12" width="6" height="1" fill="#285b28"/>
  <rect x="3" y="13" width="10" height="1" fill="#285b28"/>
  <rect x="2" y="14" width="12" height="1" fill="#285b28"/>
</svg>
